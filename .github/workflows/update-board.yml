name: Update board

on:
  schedule:
    # Mondays 06:15 UTC — after the research routine (05:30 UTC) has pushed the new board
    - cron: "15 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout ops repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: NISFIS/dropsynth-ops
          ssh-key: ${{ secrets.OPS_DEPLOY_KEY }}
          path: ops

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate board.json from newest board
        run: OPS_DIR="$GITHUB_WORKSPACE/ops" node scripts/update-board.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet src/board.json; then
            echo "board.json unchanged — nothing to deploy"
            exit 0
          fi
          git config user.name "dropsynth-bot"
          git config user.email "hello@dropsynth.app"
          git add src/board.json
          git commit -m "chore: weekly board update ($(node -e "console.log(require('./src/board.json').week)"))"
          git push
